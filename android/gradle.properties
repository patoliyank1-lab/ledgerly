# Project-wide Gradle settings

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
# Increases JVM heap for the Gradle daemon (GitHub Actions has 7 GB).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle configuration cache (speeds up repeated builds).
org.gradle.configuration-cache=true

# Enable parallel execution of independent subprojects.
org.gradle.parallel=true

# Enable caching of task outputs.
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Android / AndroidX
# ---------------------------------------------------------------------------
# Use AndroidX artifact names instead of the old support library names.
android.useAndroidX=true

# Automatically migrate dependencies to AndroidX.
android.enableJetifier=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
# Enable Kotlin incremental compilation.
kotlin.incremental=true

# Use the new Kotlin daemon (faster cold starts).
kotlin.daemon.jvm.options=-Xmx2g

# ---------------------------------------------------------------------------
# Compose
# ---------------------------------------------------------------------------
# Required to enable the Compose compiler metrics/reports if needed.
# Remove if not using compose compiler reports.
# android.compose.compilerMetricsDestination=build/compose_metrics

